# ---------------------------------------------------------------------------
# Gradle 构建配置
# ---------------------------------------------------------------------------

# 严格离线：只读本机 Gradle / Maven 缓存，不访问网络下载依赖。
org.gradle.offline=true
# Gradle 守护进程堆。Flutter 引擎 + AGP 9 + R8 在 8G 堆下基本不会 GC 抖动。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# 并行构建各模块（默认关闭）。本项目虽只有 :app，但 Flutter 插件子工程会一起参与。
org.gradle.parallel=true
# 复用任务输出缓存，二次构建（尤其是切分支 / clean 后）提速明显。
org.gradle.caching=true

# Kotlin 编译守护进程单独限制内存，避免继承 Gradle 的 8G 后抢占物理内存。
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G

# ---------------------------------------------------------------------------
# Android 插件
# ---------------------------------------------------------------------------
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# 本机构建变通（Q: 盘工程）
# ---------------------------------------------------------------------------
# 项目位于 Q: 盘，Kotlin 增量编译在关闭其 caches-jvm 落盘文件时会抛
# "Could not close incremental caches"，导致 assembleDebug 直接失败。
# 关掉增量编译即可正常构建（仅影响构建速度，不影响产物）。
# Kotlin 侧只有 MainActivity 一个 6 行文件，增量编译收益本就接近于零，
# 因此这里的代价可以忽略。
kotlin.incremental=false
kotlin.incremental.debug=false
kotlin.incremental.release=false
