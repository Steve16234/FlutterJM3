# 根目录没有 gradlew，这份 wrapper 不参与 Flutter 构建（Flutter 始终使用
# android/gradlew）。保留它是为了让 Android Studio 在此目录同步时使用与
# android/ 完全一致的 Gradle 版本与镜像，避免两份配置漂移。
# 注意：Flutter 3.50 支持的 Gradle 上限是 9.5.0，请勿单独升高这里的版本。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-all.zip
