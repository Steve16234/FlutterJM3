name: Build Android APK

# 每一次 push（任意分支）都跑一次云端构建；也支持在 Actions 页手动触发。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Flutter analyze, test & build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Show versions
        run: flutter --version

      # 同时会生成 android/local.properties（settings.gradle.kts 强依赖 flutter.sdk）。
      - name: Install dependencies
        run: flutter pub get

      # settings.gradle.kts 里的依赖仓库已带 google()/mavenCentral() 官方兜底，
      # 但 wrapper 的 distributionUrl 指向腾讯云镜像，云端下载可能不稳定。
      # 这里换成官方地址，本地开发仍走镜像不受影响。
      - name: Use official Gradle distribution in CI
        run: sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test

      # 没有 android/key.properties 时 build.gradle.kts 自动回退到 debug 签名，
      # 所以这里不需要任何 secrets 也能产出可安装的 APK。
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
